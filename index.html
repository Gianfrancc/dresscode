<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dress Code</title>
  <!-- Google Fonts: Lora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden; /* Elimina cualquier barra de scroll */
    }

    /* Oculta scrollbars en Chrome, Safari, Firefox y Edge */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      -ms-overflow-style: none; /* IE y Edge */
      scrollbar-width: none; /* Firefox */
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: 'Lora', serif;
      padding: 10px;
    }

    /* Tarjeta sin fondo ni bordes */
    .card {
      background: transparent;
      border: none;
      box-shadow: none;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 360px;
      width: 100%;
      padding: 16px;
      margin: auto;
    }

    /* Contenedor de iconos animados */
    .icons-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      margin: 0 auto 20px auto;
      width: 100%;
    }

    .icon-wrapper {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 80px;
      will-change: transform;
    }

    /* Animación continua en loop para el vestido */
    .dress-wrapper {
      animation: dressDance 3.6s ease-in-out infinite;
      transform-origin: 50% 20%;
    }

    /* Animación continua en loop para el traje */
    .suit-wrapper {
      animation: suitDance 3.6s ease-in-out infinite;
      animation-delay: 0.2s;
      transform-origin: 50% 20%;
    }

    @keyframes dressDance {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
      25% {
        transform: translateY(-4px) rotate(2deg) scale(1.02);
      }
      50% {
        transform: translateY(-1px) rotate(0deg) scale(1.01);
      }
      75% {
        transform: translateY(-5px) rotate(-1.8deg) scale(1.02);
      }
    }

    @keyframes suitDance {
      0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
      25% {
        transform: translateY(-4px) rotate(-1.6deg) scale(1.02);
      }
      50% {
        transform: translateY(-1px) rotate(0deg) scale(1.01);
      }
      75% {
        transform: translateY(-5px) rotate(1.8deg) scale(1.02);
      }
    }

    /* Efecto suave al pasar el cursor */
    .icon-wrapper:hover {
      filter: drop-shadow(0 4px 8px rgba(142, 95, 183, 0.25));
      transition: filter 0.3s ease;
    }

    .icon-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 2px 4px rgba(156, 111, 188, 0.12));
    }

    .dress-svg {
      width: 80px;
      height: auto;
    }

    .suit-svg {
      width: 72px;
      height: auto;
    }

    /* Título DRESS CODE */
    .title {
      font-family: 'Lora', serif;
      font-size: 38px;
      font-weight: 500;
      color: #8e5fb7;
      letter-spacing: 2.5px;
      text-indent: 2.5px; /* Compensa letter-spacing para centrado óptico */
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 16px;
      user-select: none;
      text-align: center;
      width: 100%;
    }

    /* Subtítulo Elegantes */
    .badge-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      font-family: 'Lora', serif;
      font-size: 21px;
      font-weight: 500;
      color: #8e5fb7;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-indent: 0.5px;
      text-align: center;
    }

    /* Divisor decorativo */
    .divider-container {
      width: 100%;
      max-width: 270px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .divider-svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Corazón decorativo con latido sutil en loop */
    .heart-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .heart-svg {
      width: 15px;
      height: auto;
      display: block;
      margin: 0 auto;
      animation: heartbeat 2.2s ease-in-out infinite;
      transform-origin: center center;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.18);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.12);
      }
      60% {
        transform: scale(1);
      }
    }

    /* Responsividad */
    @media (max-width: 480px) {
      .card {
        max-width: 310px;
        padding: 12px;
      }

      .icon-wrapper {
        width: 70px;
      }

      .title {
        font-size: 30px;
        letter-spacing: 2px;
        text-indent: 2px;
        margin-bottom: 14px;
      }

      .badge {
        font-size: 18px;
      }

      .dress-svg {
        width: 68px;
      }

      .suit-svg {
        width: 61px;
      }

      .divider-container {
        max-width: 220px;
      }
    }
  </style>
</head>
